const esc=(s)=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let state={lang:'es',page:'home',caseIndex:0,answers:[null,null,null,null]};
const $=id=>document.getElementById(id);const t=()=>TEXT[state.lang];
function setPage(page){state.page=page;render();window.scrollTo({top:0,behavior:'instant'});}
function reset(){state.answers=[null,null,null,null];state.caseIndex=0;setPage('intro');}
function chooseCase(i){state.caseIndex=Math.min(3,Math.max(0,i));setPage('case');}
function answer(i){if(state.answers[state.caseIndex]!==null)return;state.answers[state.caseIndex]=i;render();}
function navBack(){if(state.page==='home')return;if(state.page==='info'||state.page==='intro')setPage('home');else if(state.page==='case')state.caseIndex>0?chooseCase(state.caseIndex-1):setPage('intro');else if(state.page==='result')chooseCase(3);}
function navNext(){if(state.page==='home')setPage('info');else if(state.page==='info')setPage('intro');else if(state.page==='intro')chooseCase(0);else if(state.page==='case'){if(state.answers[state.caseIndex]!==null){state.caseIndex<3?chooseCase(state.caseIndex+1):setPage('result');}}else if(state.page==='result')setPage('home');}
function background(k){return `style="--sceneImage:url('${IMAGES[k]}')"`;}
function hero(){let x=t();return `<section class="hero" style="--heroImage:url('${IMAGES.hero}')"><div class="hero-photo"></div><svg class="hero-svg" viewBox="0 0 300 200" aria-hidden="true"><g fill="none" stroke="#37ceff" stroke-width="2"><path d="M36 112 88 64l34 38 49-69 55 38 42-19"/><path d="M49 151 95 129l67 13 48-49 49 36" opacity=".6"/><circle cx="88" cy="64" r="6" fill="#8af5ff"/><circle cx="171" cy="33" r="5" fill="#8af5ff"/><circle cx="226" cy="71" r="5" fill="#8af5ff"/><circle cx="162" cy="142" r="5" fill="#8af5ff"/></g></svg><div><div class="eyebrow">${x.pageLabel}</div><h1>Costa Rica<br><em>Smart Borders</em></h1><p class="hero-desc">${x.heroDesc}</p></div><div class="hero-cards"><button class="hero-card" type="button" data-act="info"><div class="cardimg" style="--cardImage:url('${IMAGES.facility}')"></div><span class="num">01</span><h2>${x.info}</h2><p>${x.cardInfoText}</p><span class="go">→</span></button><button class="hero-card" type="button" data-act="intro"><div class="cardimg" style="--cardImage:url('${IMAGES.trucks}')"></div><span class="num">02</span><h2>${x.game}</h2><p>${x.cardGameText}</p><span class="go">→</span></button></div></section>`;}
function information(){let x=t();let pipe=x.layers.map((label,i)=>`<div class="pipe"><span class="picon">${['📋','🧠','🎲'][i]}</span>${esc(label)}</div>${i<2?'<span class="parrow">→</span>':''}`).join('');return `<div class="pagehead"><div><div class="eyebrow">${x.pageLabel} · 01</div><h1>${x.infoTitle}</h1><p>${x.infoSub}</p></div><span class="tag">VUCE 3.0</span></div><div class="info-layout"><article class="info-cell"><span class="info-num">01</span><h2>${x.infoChallenge}</h2><p>${x.infoChallengeBody}</p></article><article class="info-cell tall"><span class="info-num">02</span><h2>${x.infoSolution}</h2><p>${x.infoSolutionBody}</p><div class="pipeline">${pipe}</div></article><article class="info-cell"><span class="info-num">03</span><h2>${x.infoWho}</h2><p>${x.infoWhoBody}</p></article></div><div class="info-callout"><strong>💡 ${x.infoHow}:</strong> ${x.infoCore}</div><div class="actionrow"><button class="btn primary" data-act="intro">${x.infoPlay} →</button><button class="btn flat" data-act="home">← ${x.home}</button></div><div class="rnote">${x.infoSources}</div>`;}
function intro(){let x=t();return `<section class="intro"><div class="copy"><div class="eyebrow">${x.pageLabel} · 02</div><h1>${x.introTitle}</h1><p>${x.introDesc}</p><div class="steps">${x.introSteps.map(a=>`<span>✓ ${esc(a)}</span>`).join('')}</div><div class="actionrow"><button class="btn primary" data-act="start">${x.start} →</button><button class="btn" data-act="info">${x.info}</button></div><div class="rnote">${x.synthetic}</div></div><div class="visual" style="--introImage:url('${IMAGES.hero}')"><div class="bigtag"><div class="supply"><span>🚛 ${x.introTag}</span></div><h2>${x.introVisualTitle}</h2><p>${x.introVisualDesc}</p></div></div></section>`;}
function casePage(){let x=t(),c=x.cases[state.caseIndex],ans=state.answers[state.caseIndex],answered=ans!==null;let options=c.options.map((txt,i)=>{let chosen=ans===i,good=answered&&chosen&&i===c.right,bad=answered&&chosen&&i!==c.right;return `<button class="choice ${chosen?'chosen':''} ${good?'good':''} ${bad?'bad':''}" type="button" data-choice="${i}" ${answered?'disabled':''} aria-pressed="${chosen?'true':'false'}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="ctext">${esc(txt)}</span>${chosen?'<span class="choice-check">'+(good?'✓':'•')+'</span>':''}</button>`}).join('');let feedback=answered?`<div class="feedback" role="status"><h3>${ans===c.right?'✓ '+x.good:'💡 '+x.notBest}</h3><p>${ans===c.right?c.feedbackGood:c.feedbackOther}</p></div><div class="compare"><div class="cmp"><strong>${x.traditional}</strong><span class="statvalue">${c.metrics[0][0]}</span><small>${c.metrics[0][1]}</small></div><div class="cmp highlight"><strong>${x.withTool}</strong><span class="statvalue">${c.metrics[1][0]}</span><small>${c.metrics[1][1]}</small></div></div><div class="disclaim"><strong>${x.comparison}.</strong> ${c.explain} ${c.teaching}<br>${x.metricNote}</div>`:`<div class="coach">💡 ${x.synthetic}. ${x.pick} y descubre cómo se puede resolver el problema.</div>`;return `<div class="gamebar"><div class="bar-left"><span class="level">${x.caseLabel} ${state.caseIndex+1} / 4</span><div class="progress">${[0,1,2,3].map(i=>`<span class="${i<state.caseIndex?'complete':i===state.caseIndex?'active':''}"></span>`).join('')}</div></div><span class="hint">${x.synthetic}</span></div><section class="game-layout"><div class="scene" ${background(c.photo)}><div class="scene-overlay"></div><div class="headlabels">${c.tags.map(tag=>`<span>${esc(tag)}</span>`).join('')}</div><div class="truckstamp">${truckSVG}</div><div class="scene-info"><span class="caseno">${c.symbol} · ${c.flag}</span><h2>${c.name}</h2><p>${c.brief}</p></div></div><div class="decision"><span class="small-eyebrow">${x.caseLabel} ${state.caseIndex+1} · ${x.pick}</span><h2>${c.question}</h2><div class="optionlist">${options}</div>${feedback}<div class="decision-bottom"><button class="back" data-act="previous">← ${x.backCase}</button><button class="btn primary" data-act="advance" ${!answered?'disabled':''}>${state.caseIndex===3?x.seeResult:x.nextCase} →</button></div></div></section>`;}
function result(){let x=t(),score=state.answers.reduce((a,v,i)=>a+(v===TEXT.es.cases[i].right?1:0),0);return `<section class="result"><div class="results-left"><span class="eyebrow">${x.finishTag}</span><h1>${x.finishTitle}</h1><p>${x.finishDesc}</p><div class="scorecircle"><strong>${score}/4</strong><span>${x.score}</span></div><div class="actionrow"><button class="btn primary" data-act="restart">↻ ${x.tryAgain}</button><button class="btn" data-act="home">⌂ ${x.homeText}</button></div><div class="rnote">${x.synthetic}<br>${x.finishFooter}</div></div><div class="result-cards"><div class="small-eyebrow" style="margin:0 0 5px">${x.finishLearn}</div>${x.lessons.map(l=>`<article class="resultcard"><div class="icon">${l[0]}</div><div><strong>${l[1]}</strong><p>${l[2]}</p></div></article>`).join('')}</div></section>`;}
function render(){let x=t();document.documentElement.lang=state.lang;$('langES').classList.toggle('active',state.lang==='es');$('langEN').classList.toggle('active',state.lang==='en');$('langES').setAttribute('aria-pressed',String(state.lang==='es'));$('langEN').setAttribute('aria-pressed',String(state.lang==='en'));document.querySelector('.station').textContent=x.station;$('footHome').textContent=x.home;const p=state.page;$('footPage').textContent=p==='home'?'Costa Rica Smart Borders':p==='info'?x.info:p==='intro'||p==='case'?x.game:x.finishTag;let count=p==='home'?'01 / 08':p==='info'?'02 / 08':p==='intro'?'03 / 08':p==='case'?String(state.caseIndex+4).padStart(2,'0')+' / 08':'08 / 08';$('footCount').textContent=count;$('navBack').disabled=p==='home';$('navNext').disabled=p==='case'&&state.answers[state.caseIndex]===null;$('navNext').title=x.next;$('navBack').title=x.back;$('navHome').title=x.home;$('app').innerHTML=p==='home'?hero():p==='info'?information():p==='intro'?intro():p==='case'?casePage():result();}
$('app').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.hasAttribute('data-choice')){answer(+btn.dataset.choice);return;}let act=btn.dataset.act;if(act==='info'||act==='home'||act==='intro')setPage(act);if(act==='start'){state.answers=[null,null,null,null];chooseCase(0);}if(act==='restart')reset();if(act==='previous')navBack();if(act==='advance')navNext();});$('langES').onclick=()=>{state.lang='es';render();};$('langEN').onclick=()=>{state.lang='en';render();};$('brandBtn').onclick=()=>setPage('home');$('navHome').onclick=()=>setPage('home');$('navBack').onclick=navBack;$('navNext').onclick=navNext;render();if(new URLSearchParams(location.search).get('start')==='game')reset();
</script>
