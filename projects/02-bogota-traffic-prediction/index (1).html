function layoutPanel(inner){return `<div class="map-panel">${mapSVG()}<div class="map-key">${['#00cda3','#ffdd46','#ffa13e','#ff4e68'].map((c,i)=>`<span><i class="sw" style="background:${c}"></i>${T().trafficLegend[i]}</span>`).join('')}</div><div class="map-stamp">${T().sim}</div></div>${inner}`}
function sceneList(){return `<div class="scene-list">${G.map((e,i)=>`<button class="scene ${state.index===i?'selected':''}" onclick="sc(${i})"><span class="emoji">${sceneIcons[i]}</span><span><strong>${T().scenes[i][0]}</strong><small>${T().scenes[i][1]} · ${state.results[i]!=null?'✓ '+state.results[i]+' pts':T().scenes[i][2]}</small></span><span class="right">›</span></button>`).join('')}</div>`}
function timeLine(){return `<div class="timebox"><b>${ptime(state.hour)}</b><span class="chip">${T().traffic}: ${Math.round(29+Math.max(0,1-Math.abs(state.hour-17)/7)*49)}%</span></div><input class="timeline" type="range" min="6" max="23" step=".083333" value="${state.hour}" oninput="state.hour=Number(this.value);this.parentElement.querySelector('.timebox b').textContent=ptime(state.hour);sync()" onchange="draw()"><div class="hours"><span>6 a.m.</span><span>9 a.m.</span><span>12 p.m.</span><span>3 p.m.</span><span>6 p.m.</span><span>9 p.m.</span></div>`}
function resultBars(){return `<div style="margin-top:17px">${G[state.index].scores.map((v,i)=>`<div class="barrow"><span class="emoji">${['🚦','↔️','👮','⏸'][i]}</span><span class="label">${T().actions[i]}</span><div class="bar"><i style="width:${v}%;background:${['#ffca47','#00cc9d','#ff963d','#ff5d6a'][i]}"></i></div><span class="pts">${v} pts</span></div>`).join('')}</div>`}
function topbar(){let t=T();document.documentElement.lang=state.lang;document.getElementById('header').innerHTML=`<img src="ASSETS/logo_bid_referencia.png" alt="BID"><div class="sep"></div><div class="brand">AI EXHIBITION HALL<small>From Strategy to Impact</small></div><div class="mid">${state.device==='tv'?t.tv:t.tablet} &nbsp; · &nbsp; ${t.station}</div><div class="lang"><button class="${state.lang==='es'?'active':''}" onclick="setLang('es')">ES</button><button class="${state.lang==='en'?'active':''}" onclick="setLang('en')">EN</button></div><button class="nav" onclick="go('home')">⌂ &nbsp;${t.home}</button>`;
 document.getElementById('footer').innerHTML=`<span>AI EXHIBITION HALL &nbsp; / &nbsp; PredictToDo &nbsp; / &nbsp; ${t.game}</span><span>⚪ ${t.warning}</span>`;}
function draw(){let t=T();topbar();let app=document.getElementById('app');app.innerHTML=state.device==='tv'?renderTV():renderTablet();}
function renderTablet(){let t=T(),s=state.screen,act=G[state.index];if(s==='home')return `<div class="layout"><div class="hero-photo"></div><div class="eyebrow">${t.project}</div><h1 class="h1">Predict<span class="blue">ToDo</span></h1><p class="lead" style="max-width:830px;font-size:28px">${t.sub}<br>${t.introP}</p><div style="height:100px"></div><div class="two-col"><div class="white-card hero-card"><div class="card-photo"></div><span class="chip">01</span><h2>${t.info}</h2><p>${state.lang==='es'?'Conoce la IA que predice la congestión urbana.':'Learn about the AI that forecasts urban congestion.'}</p><button class="secondary" onclick="go('info')">${t.next} →</button></div><div class="white-card hero-card"><div class="card-photo"></div><span class="chip">02</span><h2>${t.mini}</h2><p>${state.lang==='es'?'Explora el mapa, toma decisiones y recibe tu puntaje.':'Explore the map, make decisions and get your score.'}</p><button class="primary" onclick="go('intro')">${t.openMini} →</button></div></div></div>`;
if(s==='info')return `<div class="layout"><div class="eyebrow">${t.project}</div><h2 class="h2">${t.info} · PredictToDo</h2><div class="white-card" style="flex:1;padding:14px;overflow:hidden"><img src="ASSETS/infografia_${state.lang}.png" style="display:block;width:100%;height:100%;object-fit:contain" alt="Infografía PredictToDo"></div><div class="bottom-actions"><button class="secondary" onclick="go('home')">← ${t.prev}</button><button class="primary" onclick="go('intro')">${t.openMini} →</button></div></div>`;
if(s==='intro')return `<div class="layout"><div class="eyebrow">02 / PredictToDo · ${t.mini}</div><h1 class="h1">${t.game}</h1><p class="lead">${t.intro}</p><div class="steps">${t.steps.map(([a,b],i)=>`<div class="step white-card"><div class="n">0${i+1}</div><h3>${a}</h3><p>${b}</p></div>`).join('')}</div><div class="white-card" style="padding:25px;display:flex;justify-content:space-between;align-items:center"><div><span class="chip">ℹ</span><span style="font-size:20px;margin-left:17px">${t.introP}</span></div><span class="chip">${state.lang==='es'?'4 escenarios · máximo 400 puntos':'4 scenarios · maximum 400 points'}</span></div><div class="bottom-actions"><button class="secondary" onclick="go('home')">← ${t.prev}</button><button class="primary" onclick="go('player')">${t.next} →</button></div></div>`;
if(s==='player')return `<div class="layout"><div class="eyebrow">02 / PredictToDo · ${t.mini}</div><h1 class="h2">${t.choose}</h1><div class="white-card" style="padding:40px 45px;max-width:1550px"><label class="input-label" for="playername">${t.name}</label><input id="playername" class="name-field" maxlength="24" placeholder="${state.lang==='es'?'Ej.: Daniela':'E.g., Daniela'}" value="${xEsc(state.name)}" oninput="state.name=this.value;save()"><label class="input-label" style="margin:34px 0 20px">${t.pick}</label><div class="player-grid">${names.map((n,i)=>`<button class="person ${state.person===i?'selected':''}" onclick="state.person=${i};draw();sync()"><span class="face">${faces[i]}</span><strong>${n}</strong><span>${t.roles[i]}</span></button>`).join('')}</div></div><div class="bottom-actions"><button class="secondary" onclick="go('intro')">← ${t.prev}</button><button class="primary" onclick="go('explore')">${t.start} →</button></div></div>`;
if(s==='explore')return `<div class="map-layout">${layoutPanel(`<div class="side"><div class="white-card side-card"><div class="eyebrow">${t.project}</div><h3>${t.explore}</h3><p>${t.exploreP}</p>${timeLine()}</div><div class="white-card side-card fill"><h3>${t.control}</h3><p>${t.controlP}</p><div style="height:18px"></div>${sceneList()}</div><button class="primary" onclick="sc(0)">${t.openMini} →</button></div>`)}</div>`;
if(s==='decision')return `<div class="map-layout">${layoutPanel(`<div class="side"><div class="white-card side-card"><div class="mini-strip"><span class="chip">${state.index+1} / 4</span><span class="chip">🕒 ${t.scenes[state.index][1]}</span></div><div class="decision-heading"><span class="emoji">${sceneIcons[state.index]}</span><div><h2>${t.scenes[state.index][0]}</h2><p>${t.scenes[state.index][2]}</p></div></div><p class="muted" style="font-size:19px;margin-top:15px">${t.decisionP}</p></div><div class="white-card side-card fill"><h3>${t.chooseAction}</h3><div class="options">${t.actions.map((x,i)=>`<button class="action" onclick="choose(${i})"><span class="emoji">${['🚦','↔️','👮','⏸'][i]}</span><div><strong>${x}</strong><span>${t.actionDesc[i]}</span></div></button>`).join('')}</div></div><button class="secondary" onclick="go('explore')">← ${t.backMap}</button></div>`)}</div>`;
if(s==='result')return `<div class="map-layout">${layoutPanel(`<div class="side"><div class="result fill"><div class="chip">${state.index+1} / 4 · ${t.score}</div><h2 style="margin-top:16px">${act.scores[state.picked]>=85?t.good:t.partial}</h2><div class="score">${act.scores[state.picked]} / 100</div><p>${state.lang==='es'?act.ex[state.picked]:['A simulated example: compare how each response might address the challenge.','Results are illustrative and require operational validation.','The choice may help targeted traffic management.','Continue monitoring or assess alternatives.'][state.picked]}</p><h3 style="font-size:27px;margin:23px 0 0">${t.bars}</h3>${resultBars()}</div><div class="bottom-actions" style="margin-top:0"><button class="secondary" onclick="go('decision')">↶ ${t.retry}</button><button class="primary" onclick="nextScene()">${t.nextScene} →</button></div></div>`)}</div>`;
if(s==='progress')return `<div class="layout"><div class="eyebrow">02 / PredictToDo · ${t.mini}</div><h1 class="h2">${t.done}</h1><p class="lead">${t.progressP}</p><div class="progress" style="margin:38px 0">${G.map((g,i)=>`<div class="white-card step"><div class="big ${state.results[i]!=null?'checked':''}">${state.results[i]!=null?'✓':`0${i+1}`}</div><h3>${t.scenes[i][0]}</h3><p>${t.scenes[i][1]}</p><p><b>${state.results[i]!=null?state.results[i]+' / 100 pts':(state.lang==='es'?'Pendiente':'Pending')}</b></p></div>`).join('')}</div><div class="bottom-actions"><button class="secondary" onclick="go('explore')">← ${t.backMap}</button><button class="primary" onclick="nextScene()">${t.next} →</button></div></div>`;
if(s==='final'){let sum=state.results.reduce((a,b)=>a+(b||0),0);return `<div class="finish"><div class="white-card" style="padding:52px 60px;display:flex;flex-direction:column"><div class="eyebrow">${t.project}</div><div class="trophy">🏆</div><h1 class="h2">${t.finish}</h1><div class="finish-score">${sum} <span style="font-size:35px;color:#83a4be">/ 400</span></div><p>${t.finishP}</p><div class="bottom-actions"><button class="secondary" onclick="go('home')">⌂ ${t.home}</button><button class="primary" onclick="reset()">${t.restart} →</button></div></div><div class="white-card" style="padding:42px"><h2 style="font-size:36px;margin:0 0 28px">${t.done}</h2>${G.map((g,i)=>`<div style="display:flex;align-items:center;gap:18px;border-bottom:1px solid #d8e9f7;padding:22px 0"><span style="font-size:34px">${sceneIcons[i]}</span><div style="flex:1;font-size:23px;font-weight:700">${t.scenes[i][0]}</div><b style="font-size:28px;color:#078eda">${state.results[i]??0} pts</b></div>`).join('')}<div class="white-card" style="margin-top:38px;padding:27px;background:#edfbff;border-color:#aae6f9;font-size:24px;font-weight:700">${t.learning}</div></div></div>`}
return renderTablet.call(null)}
function renderTV(){let t=T(),s=state.screen;if(s==='home'||s==='intro'||s==='player')return `<div class="tv-preview"><div class="layout"><div class="eyebrow">${t.project} · PredictToDo</div><h1 class="h1" style="font-size:90px">${t.game}</h1><p class="lead" style="font-size:32px">${t.sub}</p><div class="white-card" style="margin-top:48px;padding:31px;font-size:31px;line-height:1.4">${t.introP}<div class="steps" style="grid-template-columns:repeat(2,1fr)">${t.steps.map(([a,b],i)=>`<div class="step white-card" style="min-height:170px"><div class="n" style="font-size:30px">0${i+1}</div><h3 style="font-size:25px">${a}</h3><p>${b}</p></div>`).join('')}</div></div></div><div class="map-panel">${mapSVG()}<div class="map-stamp">${t.sim}</div></div></div>`;
if(s==='explore')return `<div class="layout"><div class="tv-headline"><div class="eyebrow">${t.project}</div><h1>${t.explore}</h1><p>${t.exploreP}</p></div><div style="height:24px"></div><div class="tv-preview fill"><div class="map-panel">${mapSVG()}<div class="map-key">${t.trafficLegend.map((label,i)=>`<span><i class="sw" style="background:${['#00cda3','#ffdd46','#ffa13e','#ff4e68'][i]}"></i>${label}</span>`).join('')}</div><div class="map-stamp">${t.sim}</div></div><div class="side"><div class="white-card side-card"><div class="eyebrow">${t.hour}</div><h2 style="font-size:79px;margin:0">${ptime(state.hour)}</h2><div class="bigstats"><div class="metric"><div class="value">${Math.round(29+Math.max(0,1-Math.abs(state.hour-17)/7)*49)}%</div><div class="label">${t.traffic}</div></div><div class="metric"><div class="value">${state.hour>15&&state.hour<20?3:1}</div><div class="label">${t.corridor}</div></div></div></div><div class="white-card side-card fill"><h3>${t.events}</h3>${t.scenes.map((q,i)=>`<div style="font-size:19px;padding:10px 0;border-bottom:1px solid #deedf7">${sceneIcons[i]} &nbsp; ${q[0]}<div style="font-size:17px;color:#7097b5;margin-left:43px">${q[1]}</div></div>`).join('')}</div></div></div></div>`;
if(s==='decision'||s==='result'){let g=G[state.index];return `<div class="layout"><div class="tv-headline"><div class="eyebrow">${t.project} · ${state.index+1}/4</div><h1>${t.scenes[state.index][0]}</h1><p>${t.scenes[state.index][1]} · ${t.scenes[state.index][2]}</p></div><div style="height:24px"></div><div class="tv-preview fill"><div class="map-panel">${mapSVG()}<div class="map-stamp">${t.sim}</div></div><div class="white-card side-card" style="display:flex;flex-direction:column;justify-content:center">${s==='decision'?`<div class="chip">${t.chooseAction}</div><div style="display:grid;gap:18px;margin-top:27px">${t.actions.map((x,i)=>`<div class="white-card" style="padding:20px 25px;font-size:27px;font-weight:700">${['🚦','↔️','👮','⏸'][i]} &nbsp; ${x}</div>`).join('')}</div>`:`<div class="chip">${t.score}</div><h2 style="font-size:49px;margin:24px 0">${g.scores[state.picked]>=85?t.good:t.partial}</h2><div class="score" style="font-size:94px">${g.scores[state.picked]} / 100</div><p style="font-size:24px;color:#587c9d">${t.bars}</p>${resultBars()}`}</div></div></div>`}
if(s==='final'){let sum=state.results.reduce((a,b)=>a+(b||0),0);return `<div class="finish"><div class="white-card" style="padding:65px 70px"><div class="eyebrow">${t.project}</div><div class="trophy">🏆</div><h1 style="font-size:75px;margin:15px 0">${t.finish}</h1><div class="finish-score">${sum} / 400</div><p style="font-size:32px;color:#58799a">${t.learning}</p></div><div class="white-card" style="padding:58px"><h2 style="font-size:45px">${t.done}</h2>${t.scenes.map((q,i)=>`<div style="display:flex;gap:12px;padding:24px 0;border-bottom:1px solid #e1edf6;align-items:center;font-size:27px"><span>${sceneIcons[i]}</span><span style="flex:1">${q[0]}</span><b>${state.results[i]||0} pts</b></div>`).join('')}<p style="font-size:21px;color:#6b8aa7;margin-top:40px">${t.warning}</p></div></div>`}return ''}
function scale(){const v=Math.min(innerWidth/1920,innerHeight/1080);const st=document.querySelector('#stage');st.style.transform=`scale(${v})`;st.style.left=`${(innerWidth-1920*v)/2}px`;st.style.top=`${(innerHeight-1080*v)/2}px`}
addEventListener('resize',scale);window.addEventListener('load',()=>{scale();draw()});
if(channel)channel.onmessage=({data})=>{if(state.device==='tv'){state={...state,...data};draw();save()}}
</script></body></html>
