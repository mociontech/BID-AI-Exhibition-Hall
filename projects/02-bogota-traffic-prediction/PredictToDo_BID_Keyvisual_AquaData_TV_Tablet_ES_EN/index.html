 "TV/EN/06_How_AI_learns_EN.png"}, {"index": 7, "title": "What it predicts", "subtitle": "Congestion and speed.", "tv": "TV/EN/07_What_it_predicts_EN.png"}, {"index": 8, "title": "Results", "subtitle": "How accurate is the model?", "tv": "TV/EN/08_Results_EN.png"}], "EN_tablet": "TABLET/Menu_Informacion_Tablet_EN.png"}, "usage": "Visual assets are illustrative; traffic paths are simulated and model metrics are from DigitalMornings.pdf, subject to validation."};let lang='ES',mode='TV',selected=0;function setLang(s){lang=s;render()}function setMode(s){mode=s;render()}function prev(){selected=(selected+7)%8;render()}function next(){selected=(selected+1)%8;render()}function render(){document.getElementById('es').classList.toggle('active',lang==='ES');document.getElementById('en').classList.toggle('active',lang==='EN');document.getElementById('tabtablet').classList.toggle('active',mode==='TABLET');document.getElementById('tabtv').classList.toggle('active',mode==='TV');const a=content.languages[lang];document.getElementById('heading').textContent=mode==='TV'?(lang==='ES'?'Pantalla principal · TV':'Main screen · TV'):(lang==='ES'?'Menú de temas · Tableta':'Topic selection · Tablet');document.getElementById('main').src=mode==='TV'?a[selected].tv:content.languages[lang+'_tablet'];document.getElementById('strip').innerHTML=a.map((item,i)=>`<button class="tile ${i===selected?'active':''}" onclick="selected=${i};mode='TV';render()"><img src="${item.tv}" alt="${item.title}"><span>${item.index.toString().padStart(2,'0')} · ${item.title}</span></button>`).join('');document.getElementById('note').textContent=lang==='ES'?'Visualización ilustrativa, no datos en vivo. Cifras sujetas a validación.':'Illustrative visualization, not live data. Figures subject to validation.';}render();</script></body></html>
