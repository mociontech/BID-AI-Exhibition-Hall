<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>AquaData | Selección de inspecciones</title><style>
:root{--navy:#082d56;--blue:#008ee1;--grey:#6081a2;--border:#c9e5fa;--mint:#12b7a6;--pink:#e75d72;--yellow:#e8a52d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,'Segoe UI',Arial,sans-serif;background:#e7f4fc;color:var(--navy)}button{font:inherit;cursor:pointer}
#stage{position:absolute;inset:0;overflow:hidden}#app{width:1920px;height:1080px;position:absolute;left:0;top:0;overflow:hidden;transform-origin:top left;background:linear-gradient(128deg,#fff 0%,#fbfdff 44%,#edf8ff 100%)}
#app:before{content:"";position:absolute;width:1080px;height:1000px;right:-510px;top:-590px;border:10px solid #35aefa;border-radius:50%;box-shadow:0 0 0 74px #25acfa11,0 0 0 130px #25acfa10;pointer-events:none}
#app:after{content:"";position:absolute;inset:0;opacity:.45;pointer-events:none;background-image:radial-gradient(#46baff 1.5px,transparent 1.5px);background-size:31px 31px;mask-image:linear-gradient(90deg,transparent 56%,#000 100%)}
.back-water{position:absolute;right:0;top:90px;width:650px;height:370px;opacity:.2;background:linear-gradient(90deg,#fff 0%,transparent 65%),url('assets/negocios/residencial.jpg') center/cover;clip-path:ellipse(63% 80% at 84% 40%)}
.header{height:124px;position:relative;z-index:2;display:flex;align-items:center;gap:40px;padding:18px 60px;border-bottom:1px solid #d8ecf8;background:#ffffffb5}.brand img{width:380px;height:auto;display:block}.steps{display:flex;align-items:center;gap:18px;margin-left:auto;margin-right:auto}.step{border:2px solid #c5e0f5;border-radius:100%;background:#fff;width:53px;height:53px;display:grid;place-items:center;color:#7597b8;font-weight:700;font-size:20px}.step.active{color:#fff;background:#0096e7;border-color:#0096e7;box-shadow:0 6px 20px #0b9fe346}.step.done{color:#068edc;background:#e2f4ff;border-color:#9bd8f7}.lang{border-radius:35px;border:1px solid #c8e2f4;background:#fff;padding:4px;display:flex;gap:2px}.lang button{border:0;border-radius:28px;padding:12px 17px;font-weight:800;background:transparent;color:#7292af}.lang button.active{background:var(--blue);color:#fff}
.content{position:relative;z-index:1;padding:37px 65px 0}.eyebrow{font-size:20px;color:#078fd9;font-weight:800;letter-spacing:1px}.hline{display:flex;align-items:center;justify-content:space-between;gap:25px}.head h1{font-size:54px;line-height:1.1;margin:13px 0 9px;letter-spacing:-1.9px;max-width:1500px}.head h1 .accent{color:#008fe0}.head p{font-size:25px;color:#4c7495;margin:0 0 5px}.head .strongline{font-size:28px;color:#183d65}.capacity{width:215px;flex:none;background:#e2f4ff;border:1px solid #bde2f9;border-radius:25px;text-align:center;padding:16px;color:#356a95;box-shadow:0 8px 22px #067db60c}.capacity small{display:block;font-size:18px;line-height:1.2}.capacity strong{display:block;font-size:46px;color:#008fe0;line-height:1.25}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px;margin-top:20px}.business{border:2px solid #c8e4f8;min-width:0;height:268px;border-radius:23px;padding:9px 10px 12px;background:#ffffffee;position:relative;box-shadow:0 9px 24px #1789c611;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;overflow:hidden}.business:hover{border-color:#0097e9;transform:translateY(-3px)}.business.chosen{border-color:#009be9;background:#effaff;box-shadow:0 0 0 3px #7fcfff77,0 12px 28px #138dcb26}.business img{width:100%;height:146px;object-fit:cover;display:block;border-radius:13px}.business .details{position:relative;display:flex;justify-content:space-between;gap:8px;padding:11px 9px 0}.code{font-size:16px;color:#2787c0;font-weight:800;letter-spacing:1px}.bname{font-size:22px;color:#092e55;font-weight:800;line-height:1.17;margin-top:3px;max-width:330px;min-height:50px}.btype{font-size:17px;color:#7393b3;line-height:1.2;margin-top:1px}.round-circle{border:2px solid #a6cbe5;border-radius:50%;width:39px;height:39px;flex:none;display:grid;place-items:center;align-self:flex-end;color:#fff;font-size:26px}.chosen .round-circle{background:#008ee1;border-color:#008ee1}.risk-score{position:absolute;top:18px;right:20px;border-radius:16px;background:#fffefcdd;border:1px solid #ffffffd9;padding:7px 10px;min-width:71px;text-align:center;box-shadow:0 2px 15px #012c4b22;font-size:27px;font-weight:900}.risk-score.high{color:#e55970}.risk-score.medium{color:#d59b28}.risk-score.low{color:#10a898}.risk-score span{font-size:11px;display:block;font-weight:700;text-transform:uppercase}.overlay-spark{position:absolute;right:14px;bottom:11px;width:120px;height:25px;opacity:.8}.business.ai .bname{font-size:19px;min-height:43px}.business.ai .details{padding-top:8px}.business.ai .btype{font-size:15px}.business.ai .round-circle{width:33px;height:33px}.business.ai img{height:146px}.business.ai{height:268px}.business.ai .code{font-size:14px}.note{margin-top:11px;padding:10px 18px;border-radius:17px;background:#ecf8ff;border:1px solid #d4ecfa;color:#4d7594;font-size:17px;display:flex;align-items:center;gap:10px}.note .ico{font-size:23px;color:#008fe2}.foot{position:absolute;left:65px;right:65px;bottom:18px;display:flex;align-items:center;justify-content:space-between;z-index:2}.button{border:1px solid #bbdff7;background:#fff;color:#18557e;border-radius:60px;padding:18px 32px;font-size:20px;font-weight:800;min-width:175px;min-height:62px}.button.primary{border:none;min-width:290px;background:#0093e1;color:#fff;box-shadow:0 12px 30px #008fe133}.button:disabled{background:#a8c5d8;box-shadow:none;cursor:default}.foot .small{font-size:17px;color:#7a9bb6;text-align:center}.foot .small b{color:#0b93d8}
</style></head><body><div id="stage"><main id="app"><div class="back-water"></div><header class="header"><div class="brand"><img src="assets/logo_bID_ref.png" alt="BID AI Exhibition Hall"></div><div class="steps" id="steps"></div><div class="lang"><button type="button" id="lang-es">ES</button><button type="button" id="lang-en">EN</button></div></header><section class="content"><div class="hline"><div class="head"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="strongline" id="sub1"></p><p id="sub2"></p></div><div class="capacity"><small id="cap"></small><strong id="counter">0/3</strong></div></div><div id="cards" class="cards"></div><div id="note" class="note"></div></section><footer class="foot"><button id="back" class="button"></button><span class="small" id="disclaimer"></span><button id="submit" class="button primary"></button></footer></main></div><script>
const clients=[{"id": "A-01", "asset": "residencial", "es": "Conjunto Mirador", "en": "Mirador Residences", "esType": "Residencial", "enType": "Residential", "risk": 72, "series": [48, 46, 45, 49, 44, 31, 25]}, {"id": "A-02", "asset": "restaurante", "es": "Restaurante La Terraza", "en": "La Terraza Restaurant", "esType": "Gastronomía", "enType": "Food service", "risk": 25, "series": [32, 36, 33, 35, 34, 38, 37]}, {"id": "A-03", "asset": "hotel", "es": "Hotel Vista Azul", "en": "Vista Azul Hotel", "esType": "Hospedaje", "enType": "Hospitality", "risk": 88, "series": [55, 57, 53, 49, 17, 12, 10]}, {"id": "A-04", "asset": "centro_comercial", "es": "C. Comercial Río Claro", "en": "Río Claro Shopping Mall", "esType": "Comercio", "enType": "Retail", "risk": 41, "series": [42, 45, 44, 40, 47, 43, 41]}, {"id": "A-05", "asset": "industria", "es": "Alimentos del Valle", "en": "Del Valle Food Plant", "esType": "Industria", "enType": "Industry", "risk": 67, "series": [64, 61, 67, 63, 49, 43, 38]}, {"id": "A-06", "asset": "autolavado", "es": "Autolavado Brisas", "en": "Brisas Car Wash", "esType": "Servicios", "enType": "Services", "risk": 53, "series": [28, 29, 30, 27, 29, 13, 15]}, {"id": "A-07", "asset": "clinica", "es": "Clínica San Gabriel", "en": "San Gabriel Clinic", "esType": "Salud", "enType": "Healthcare", "risk": 19, "series": [38, 40, 37, 41, 39, 38, 40]}, {"id": "A-08", "asset": "colegio", "es": "Colegio Los Pinos", "en": "Los Pinos School", "esType": "Educación", "enType": "Education", "risk": 36, "series": [24, 26, 25, 24, 26, 25, 24]}];
let lang=new URLSearchParams(location.search).get('lang')||'es', round=new URLSearchParams(location.search).get('round')==='with'?'with':'without';
let selected=[];
const T={es:{eyebrow:['RONDA 1 · DECISIÓN SIN DATOS','RONDA 2 · PRIORIZACIÓN CON IA'],title:['Selecciona <span class="accent">sin</span> inteligencia artificial','Selecciona <span class="accent">con AquaData</span>'],sub1:'Tienes 8 contratos y solo puedes inspeccionar 3.',sub2:['Confía en tu criterio. Esta ronda no muestra puntajes de riesgo.','Ahora puedes consultar los puntajes de riesgo estimados. ¿Qué contratos visitarías primero?'],cap:'Inspecciones seleccionadas',back:'← Volver',submit:'Confirmar inspecciones →',disabled:'Selecciona 3 contratos',note:['Ocho establecimientos ficticios. Su actividad comercial no indica que exista fraude.','Simulación educativa: una puntuación alta NO significa fraude confirmado. La inspección en campo verifica.'],bottom:'Referencias visuales para Codex · Datos ficticios'},en:{eyebrow:['ROUND 1 · WITHOUT RISK DATA','ROUND 2 · AI-ASSISTED PRIORITIZATION'],title:['Select <span class="accent">without</span> artificial intelligence','Select <span class="accent">with AquaData</span>'],sub1:'You have 8 contracts and can inspect only 3.',sub2:['Trust your judgment. No risk scores are shown in this round.','You can now see estimated risk scores. Which contracts would you inspect first?'],cap:'Inspections selected',back:'← Back',submit:'Confirm inspections →',disabled:'Select 3 contracts',note:['Eight fictional premises. Business type does not imply wrongdoing.','Educational simulation: a high score does NOT confirm fraud. On-site inspections verify findings.'],bottom:'Visual references for Codex · Fictional data'}};
function resize(){const w=window.innerWidth,h=window.innerHeight,s=Math.min(w/1920,h/1080);const x=(w-1920*s)/2,y=(h-1080*s)/2;const el=document.getElementById('app');el.style.transform=`translate(${x}px,${y}px) scale(${s})`}
function spark(arr){const pts=arr.map((v,i)=>`${i*14},${30-v/2.5}`).join(' ');return `<svg class="overlay-spark" viewBox="0 0 90 36" preserveAspectRatio="none"><polyline fill="none" stroke="#099adf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`}
function render(){const t=T[lang],i=round==='with'?1:0;document.documentElement.lang=lang;document.getElementById('eyebrow').textContent=t.eyebrow[i];document.getElementById('title').innerHTML=t.title[i];document.getElementById('sub1').textContent=t.sub1;document.getElementById('sub2').textContent=t.sub2[i];document.getElementById('cap').textContent=t.cap;document.getElementById('counter').textContent=selected.length+'/3';document.getElementById('note').innerHTML='<span class="ico">ⓘ</span>'+t.note[i];document.getElementById('disclaimer').textContent=t.bottom;document.getElementById('back').textContent=t.back;document.getElementById('steps').innerHTML=Array.from({length:6},(_,k)=>`<span class="step ${k===(i?3:1)?'active':k<(i?3:1)?'done':''}">${k+1}</span>`).join('');for(const l of ['es','en'])document.getElementById('lang-'+l).classList.toggle('active',l===lang);
document.getElementById('cards').innerHTML=clients.map((c,idx)=>{let v=c.risk,col=v>=70?'high':v>=40?'medium':'low';let type=lang==='es'?c.esType:c.enType;return `<button aria-label="${c.id}: ${lang==='es'?c.es:c.en}" aria-pressed="${selected.includes(c.id)}" class="business ${i?'ai':''} ${selected.includes(c.id)?'chosen':''}" data-id="${c.id}"><img src="assets/negocios/${c.asset}.jpg" alt=""><div class="details"><div><div class="code">${c.id} · ${type}</div><div class="bname">${lang==='es'?c.es:c.en}</div>${i?'':`<div class="btype">${type}</div>`}</div><span class="round-circle">${selected.includes(c.id)?'✓':''}</span></div>${i?`<div class="risk-score ${col}">${v}<span>${lang==='es'?'RIESGO':'RISK'}</span></div>${spark(c.series)}`:''}</button>`}).join('');document.querySelectorAll('.business').forEach(b=>b.onclick=()=>{let id=b.getAttribute('data-id');selected=selected.includes(id)?selected.filter(x=>x!==id):selected.length<3?[...selected,id]:selected;render()});const btn=document.getElementById('submit');btn.disabled=selected.length!==3;btn.textContent=btn.disabled?t.disabled:t.submit;}
document.getElementById('lang-es').onclick=()=>{lang='es';render()};document.getElementById('lang-en').onclick=()=>{lang='en';render()};document.getElementById('back').onclick=()=>{round=round==='with'?'without':'with';selected=[];render()};document.getElementById('submit').onclick=()=>{if(selected.length!==3)return;round=round==='with'?'without':'with';selected=[];render()};window.addEventListener('resize',resize);render();resize();</script></body></html>
